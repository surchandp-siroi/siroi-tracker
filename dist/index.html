<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Financial dashboard for Siroi Forex — Internal Portal" />
    <title>Siroi Forex Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location.pathname.length > 1 && window.location.pathname.endsWith('/')) {
          var cleanPath = window.location.pathname.replace(/\/+$/, '') + window.location.search + window.location.hash;
          window.location.replace(cleanPath);
        }
        try {
          var now = new Date();
          var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          var ist = new Date(utc + (330 * 60000));
          var h = ist.getHours();
          var scheduled = (h >= 17 || h < 6) ? 'dark' : 'light';
          
          var manual = localStorage.getItem('theme_manual_override');
          var manualTime = parseInt(localStorage.getItem('theme_manual_override_time') || '0', 10);
          
          var y = ist.getFullYear(), m = ist.getMonth(), d = ist.getDate();
          function istToEpoch(year, month, day, hour) {
            return Date.UTC(year, month, day, hour, 0, 0, 0) - (330 * 60000);
          }
          var lastTransition = 0;
          if (h >= 17) {
            lastTransition = istToEpoch(y, m, d, 17);
          } else if (h >= 6) {
            lastTransition = istToEpoch(y, m, d, 6);
          } else {
            var yesterday = new Date(ist.getTime() - 86400000);
            lastTransition = istToEpoch(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate(), 17);
          }
          
          var theme = (manual && manualTime > lastTransition) ? manual : scheduled;
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/main-BzXLMUOy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DaKuRZi2.css">
  </head>
  <body class="font-sans antialiased min-h-screen flex flex-col">
    <div id="root"></div>
  </body>
</html>
