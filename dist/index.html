<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Financial dashboard for Siroi Forex — Internal Portal" />
    <title>Siroi Forex Dashboard</title>

    <!-- Strict Cache Prevention Directives -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, post-check=0, pre-check=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon & Touch Icons with Cache-Buster -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=2" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
    <link rel="shortcut icon" href="./favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        // Force browser to dump any stale cached favicons and load the new logo
        try {
          var existing = document.querySelectorAll("link[rel*='icon']");
          for (var eIdx = 0; eIdx < existing.length; eIdx++) {
            if (existing[eIdx].parentNode) existing[eIdx].parentNode.removeChild(existing[eIdx]);
          }
          var origin = window.location.origin || '';
          var head = document.head || document.getElementsByTagName('head')[0];
          var v = 'v2-' + Date.now();
          [
            { rel: 'icon', type: 'image/png', sizes: '32x32', href: origin + '/favicon.png?v=' + v },
            { rel: 'icon', type: 'image/x-icon', href: origin + '/favicon.ico?v=' + v },
            { rel: 'shortcut icon', href: origin + '/favicon.ico?v=' + v },
            { rel: 'apple-touch-icon', sizes: '180x180', href: origin + '/apple-touch-icon.png?v=' + v }
          ].forEach(function(item) {
            var link = document.createElement('link');
            link.rel = item.rel;
            if (item.type) link.type = item.type;
            if (item.sizes) link.sizes = item.sizes;
            link.href = item.href;
            head.appendChild(link);
          });
        } catch (e) {}

        // Proactively unregister any legacy Service Workers & purge CacheStorage
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
            });
          }
        } catch (e) {}

        if (typeof window !== 'undefined' && window.location.pathname.length > 1 && window.location.pathname.endsWith('/')) {
          var cleanPath = window.location.pathname.replace(/\/+$/, '') + window.location.search + window.location.hash;
          window.location.replace(cleanPath);
        }
        try {
          var now = new Date();
          var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          var ist = new Date(utc + (330 * 60000));
          var h = ist.getHours();
          var scheduled = (h >= 17 || h < 6) ? 'dark' : 'light';
          
          var manual = localStorage.getItem('theme_manual_override');
          var manualTime = parseInt(localStorage.getItem('theme_manual_override_time') || '0', 10);
          
          var y = ist.getFullYear(), m = ist.getMonth(), d = ist.getDate();
          function istToEpoch(year, month, day, hour) {
            return Date.UTC(year, month, day, hour, 0, 0, 0) - (330 * 60000);
          }
          var lastTransition = 0;
          if (h >= 17) {
            lastTransition = istToEpoch(y, m, d, 17);
          } else if (h >= 6) {
            lastTransition = istToEpoch(y, m, d, 6);
          } else {
            var yesterday = new Date(ist.getTime() - 86400000);
            lastTransition = istToEpoch(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate(), 17);
          }
          
          var theme = (manual && manualTime > lastTransition) ? manual : scheduled;
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/main-BNve-PeO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DTQ4Yy4G.css">
  </head>
  <body class="font-sans antialiased min-h-screen flex flex-col">
    <div id="root"></div>
  </body>
</html>
