name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Build Project
        run: npm run build:ota
        env:
          VITE_SUPABASE_URL: "https://jybkjinujujlsvqsercv.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5YmtqaW51anVqbHN2cXNlcmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2OTUxMDMsImV4cCI6MjA5MjI3MTEwM30.rS2JwGhXgIXQccZXbPaYDr47zrmoXWn6EcAzoFZMKeI"

        
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ 
          server-dir: ./dist/ 
          state-name: .ftp-deploy-sync-state-v2.json
          timeout: 600000
          port: 21
          protocol: ftps
          security: loose

      - name: Notify Users of App Update
        run: |
          curl -X POST "https://jybkjinujujlsvqsercv.supabase.co/functions/v1/notify" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5YmtqaW51anVqbHN2cXNlcmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2OTUxMDMsImV4cCI6MjA5MjI3MTEwM30.rS2JwGhXgIXQccZXbPaYDr47zrmoXWn6EcAzoFZMKeI" \
            -H "Content-Type: application/json" \
            -d '{"action": "app_updated", "payload": {}}'
